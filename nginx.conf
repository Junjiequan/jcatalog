server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # hashed build assets never change: cache them for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # the page and the runtime filter configuration are read fresh, so editing filters.yaml needs no rebuild
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /filters.yaml { add_header Cache-Control "no-cache"; }

  # every other path is a route of the single-page app
  location / {
    try_files $uri /index.html;
  }
}
